# YOLO26s trained on FSOCO (yolo26s_fsoco.pt), fine-tuned on the simulator images the same way as
# yolo26n_fsoco_fsds.yaml, about 50 minutes. The batch is the one of the FSOCO training.
model: models/detection/yolo26s_fsoco.pt
data: data/processed/fsds_yolo/fsds.yaml
imgsz: 1280
epochs: 25
close_mosaic: 3
batch: 8
workers: 4
seed: 0
