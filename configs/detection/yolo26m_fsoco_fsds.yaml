# YOLO26m trained on FSOCO (yolo26m_fsoco.pt), fine-tuned on the simulator images the same way as
# yolo26n_fsoco_fsds.yaml, about an hour and a half. The batch is the one of the FSOCO training.
model: models/detection/yolo26m_fsoco.pt
data: data/processed/fsds_yolo/fsds.yaml
imgsz: 1280
epochs: 25
close_mosaic: 3
batch: 4
workers: 4
seed: 0
